name: CI

on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'
      - 'develop'
  pull_request:
    branches:
      - 'feature/**'
      - 'hotfix/**'
      - 'develop'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npx oxlint . && npx eslint .

      - name: Build
        run: npm run build
